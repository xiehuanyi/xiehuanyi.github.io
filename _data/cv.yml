    Projects:
      - name: pi-rsi
        url: https://github.com/xiehuanyi/pi-rsi
        summary: Automated Research Harness. [Project page](https://xiehuanyi.github.io/pi-rsi/).
        highlights:
          - Built and open-sourced a research harness around headless coding agents for hypothesis generation, code implementation, frozen evaluation, and result analysis, with tree search, isolated git worktrees, structured handoffs, budget controls, and failure recovery.
          - Experiments form a search tree scored by a frozen evaluator, where a gain must clear measured noise; a layered research wiki links hypotheses to supporting and opposing evidence. A 4-day autonomous run on CASMI26 raised MRR from 0.307 to 0.4197.

      - name: ZOMoE
        url: https://github.com/xiehuanyi/ZOMoE-release
        summary: Zeroth-Order Fine-Tuning of Sparse MoE Models. Submitted to ICLR 2027.
        highlights:
          - Developed expert-index replay with shared-baseline one-sided estimation to prevent discrete expert switching from contaminating ZO loss comparisons, while recomputing continuous routing weights and expert outputs.
          - Evaluated OLMoE-1B-7B and Qwen3.5-35B-A3B on six classification tasks; reported configurations improved mean test accuracy over FZOO by 3.23/2.81 percentage points, with at most 0.04 GiB replay memory overhead in matched measurements.

