    Open Source Projects:
      - name: nanoSGLang
        url: https://github.com/xiehuanyi/nanoSGLang
        summary: Minimal LLM Serving Engine.
        highlights:
          - Built a high-performance LLM serving engine from scratch in Python/PyTorch, implementing continuous batching, chunked prefill, paged KV cache, prefix-sharing radix cache, streaming API, and request-level metrics.
          - Integrated FlashInfer paged attention and fused operators; benchmarked Qwen2.5-0.5B at 3469 tok/s on RTX A5000, exceeding the referenced SGLang baseline in the same workload.

      - name: nanoMegatron
        url: https://github.com/xiehuanyi/nanoMegatron
        summary: Minimal Distributed Training Framework.
        highlights:
          - Implemented core distributed-training algorithms in a compact educational codebase, including DDP, ZeRO-1/2/3, tensor parallelism, sequence parallelism, pipeline parallelism, and expert parallelism.
          - Built a working SFT pipeline for Phi-tiny-MoE and GSM8K, with MoE AllToAll dispatch, ZeRO/FSDP-style sharding, and benchmark logs against DeepSpeed/PyTorch FSDP.

